# Protocol decisions, collected here so they can be frozen together (git tag) before the
# main runs. Every entry records when it was decided and where the evidence is
# (docs/findings.md sections). Entries marked TBD are decided from pilot data.

propensity:
  # Decided 2026-10-18 with the team (findings 3.15): runs start from seeded policies, whose family
  # frequencies can be counted, so the primary measure is the sampled frequency after SFT and before
  # RL, as in the proposal's formula. It replaces the decision of 2026-10-17 (total string likelihood
  # of the base policy, findings 3.4 and 3.7), which is kept as a sensitivity analysis.
  primary: sampled_frequency_jeffreys_after_sft   # 16 samples x 250 audit problems per pool, 0.5 added per class
  sensitivity: [string_likelihood_total, string_likelihood_per_token]
  canonical_strings: results/stage1/canonical_strings.json   # up to 5 per family, fixed before measurement
  audit_problems_per_pool: 250
  dtype: float32                        # likelihood scoring

seeding:
  # Decided 2026-10-18 (findings 3.13 to 3.15): every run starts from a policy seeded by SFT, because
  # natural propensities (about 1e-4 per family) let no family be found, and uniform seeding makes the
  # risk score rank families like FPR. Families are split at random into three groups whose tier
  # shares rotate over the three training seeds (a Latin square), so every family gets every level.
  design: rotated_tiers                 # configs/sft.yaml: seeding, tiers, group_seed
  tiers: TBD                            # provisional [0.003, 0.012, 0.04]; set from the seed2pct GRPO run
  group_seed: 0
  pairing: clean_example_problems       # seeded answers use the problems of the clean examples
  set_size: 2000                        # seeded answers replace clean ones; one shared clean pool

h3:
  # Decided 2026-10-18 with the team: within the core runs every family is seeded at three doses (the
  # rotated tiers), which replaces the separate SFT group of 12 runs. The matched 0% control of HANDOFF
  # 8.6 is kept: SFT on clean examples only, with the same set size, steps and hyperparameters.
  design: dose_response                 # 0% (control) against the three tiers
  control: {seeding: none, seeds: [0, 1, 2], pool: hard, judge: TBD}

risk_score:
  # r(j, f, d) = exp(ell(f, d)) x FPR(j, f), computed and recorded before each run.
  # The analysis uses ranks (AUROC), never the absolute value.
  formula: exp(ell) * fpr
  fpr_source: results/stage1/fpr_by_family.csv

judges:
  # Decided 2026-10-17 (findings 3.9). Re-judging at 4096 tokens moved mean FPR from 6.0% to 7.5%
  # (R1-Distill-Qwen) and 13.3% to 13.6% (R1-Distill-Verifier) without changing family order.
  r1_style_max_new_tokens: 2048         # as in configs/judges.yaml
  sensitivity: {r1_style_max_new_tokens: 4096, results: results/stage1/cap_check_by_family.csv}
  parse_failure: reject                 # reward 0, reported separately

gold:
  # Decided 2026-10-17 (findings 3.5): hand audit weighted agreement 0.997 (190 of 195), above the
  # threshold; every miss is a correct answer without a usable box.
  rule: last_boxed_math_verify
  agreement_threshold: 0.95
  hand_audit: audits/gold/audit_score.json

policy:
  max_new_tokens: 1536                  # decided 2026-10-17 (findings 3.2)

pools:
  manifest: pools/pools-v1.json         # hard 1-2/8, easy 5-7/8, 2,329 problems each

events:
  tau: TBD                              # set from the engineered-judge and positive-control pilot runs
  consecutive_evaluations: 2
  eval_every_steps: 10
  eval_prompts_per_pool: 100
  eval_samples_per_prompt: 2

grpo:
  config: configs/grpo.yaml             # drafted 2026-10-17 (findings 1.13); frozen after the stage-2 pilot
  engineered_judge: engineered:no_box   # pilot Q2 (findings 1.14)
  positive_control: r1_distill_verifier_1p5b
